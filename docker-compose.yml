services:
  postgres:
    image: postgres:16
    container_name: postgres_db
    restart: always
    environment:
      NODE_ENV: ${NODE_ENV}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - ${DB_PORT}:5432
    volumes:
      - pgdata:/var/lib/postgresql/data

